<title>Full-Stack Bootcamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a field-notebook syllabus. Sticky course map on the left, one lesson at a time on the right;
   code demos sit on a dark "terminal" panel in both themes. Sky = structure, sun = "you are here", red = action/errors. */
:root {
  --bg: #ffffff;
  --surface: #f2f9fd;
  --surface-2: #e2f2fb;
  --fg: #0c2131;
  --muted: #4a6375;
  --line: #d3e6f1;
  --line-strong: #9cc7de;
  --sky: #87ceeb;
  --sky-ink: #0a6c9f;
  --sun: #ffd23f;
  --sun-soft: #fff4c7;
  --sun-ink: #7a5900;
  --red: #e2363c;
  --red-ink: #b81f26;
  --red-soft: #fde6e6;
  --ok: #16794a;
  --code-bg: #0c2131;
  --code-fg: #e6f2f9;
  --code-dim: #7d98aa;
  --code-hl: rgba(255, 210, 63, 0.16);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1621; --surface: #0f2130; --surface-2: #15304a; --fg: #ecf6fc; --muted: #9bb6c8;
    --line: #1f394d; --line-strong: #2f5a78; --sky: #87ceeb; --sky-ink: #8fd4f2; --sun: #ffd23f; --sun-soft: #3a3110;
    --sun-ink: #ffd95e; --red: #ff5d62; --red-ink: #ff8589; --red-soft: #3c1719; --ok: #4ed69a;
    --code-bg: #06111a; --code-fg: #e6f2f9; --code-dim: #6f8ca0; --code-hl: rgba(255, 210, 63, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1621; --surface: #0f2130; --surface-2: #15304a; --fg: #ecf6fc; --muted: #9bb6c8;
  --line: #1f394d; --line-strong: #2f5a78; --sky: #87ceeb; --sky-ink: #8fd4f2; --sun: #ffd23f; --sun-soft: #3a3110;
  --sun-ink: #ffd95e; --red: #ff5d62; --red-ink: #ff8589; --red-soft: #3c1719; --ok: #4ed69a;
  --code-bg: #06111a; --code-fg: #e6f2f9; --code-dim: #6f8ca0; --code-hl: rgba(255, 210, 63, 0.14);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
a { color: var(--sky-ink); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--sky-ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 112%; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 750; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.label { font-family: var(--f-display); font-stretch: 100%; text-transform: uppercase; letter-spacing: 0.09em; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 850; font-stretch: 118%; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.overall { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.overall .bar { width: 120px; }
.sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.side {
  position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 57px - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.tier-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; margin-bottom: 14px; }
.tier-tabs button { border: 0; background: transparent; padding: 7px 4px; border-radius: 7px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.tier-tabs button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 0 var(--line-strong); }
.navgroup { display: grid; gap: 2px; margin-bottom: 16px; }
.navgroup .label { margin: 4px 8px 6px; }
.navlink { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); padding: 7px 10px; border-radius: 8px; font-size: 0.93rem; }
.navlink:hover { background: var(--surface-2); }
.navlink[aria-current="page"] { background: var(--sun-soft); box-shadow: inset 3px 0 0 var(--sun); font-weight: 700; }
.navlink .count { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.navlink .count.full { color: var(--ok); font-weight: 600; }

main {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.page > *, .section > *, figure.diagram > *, .practice > *, .project > * { min-width: 0; }

/* ---------- shared pieces ---------- */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sky); border-radius: 99px; transition: width 0.4s ease; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.pill.sun { background: var(--sun-soft); color: var(--sun-ink); }
.pill.red { background: var(--red-soft); color: var(--red-ink); }
.pill.ok { background: transparent; color: var(--ok); border: 1px solid currentColor; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 9px; padding: 9px 16px; font-weight: 700; text-decoration: none; color: var(--fg); }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #2a2100; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.section { display: grid; gap: 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.prose strong { color: var(--fg); }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
.linkrow a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; font-size: 0.9rem; font-weight: 700; color: var(--fg); background: var(--bg); }
.linkrow a:hover { border-color: var(--sky-ink); }
.linkrow svg { width: 16px; height: 16px; flex: none; }

/* ---------- home ---------- */
.hero { display: grid; gap: 16px; padding: 28px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: var(--sun); opacity: 0.55; }
.hero > * { position: relative; z-index: 1; }
.hero p.lede { font-size: 1.1rem; max-width: 56ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tier-card { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); text-decoration: none; color: var(--fg); background: var(--bg); }
.tier-card:hover { border-color: var(--sky-ink); }
.tier-card .stripe { height: 4px; border-radius: 4px; background: var(--sky); width: 40px; }
.tier-card.t-intermediate .stripe { background: var(--sun); width: 72px; }
.tier-card.t-advanced .stripe { background: var(--red); width: 104px; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mod-card { display: grid; gap: 10px; align-content: start; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); text-decoration: none; color: var(--fg); background: var(--bg); position: relative; }
.mod-card:hover { border-color: var(--sky-ink); }
.mod-card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mod-card .step { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.mod-card h3 { font-size: 1.05rem; }
.mod-card p { font-size: 0.9rem; color: var(--muted); }

/* ---------- module ---------- */
.lesson-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: l; }
.lesson-list a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--fg); background: var(--bg); }
.lesson-list a:hover { border-color: var(--sky-ink); }
.lesson-list .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.8rem; font-weight: 600; background: var(--surface-2); }
.lesson-list .done .num { background: var(--sky); color: #06202e; }
.lesson-list .meta { font-size: 0.85rem; color: var(--muted); }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.outline li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface); }
.outline li::before { content: ""; width: 10px; height: 10px; margin-top: 7px; border-radius: 3px; border: 2px solid var(--line-strong); }
.callout { padding: 14px 16px; border-radius: var(--radius); border: 1px dashed var(--line-strong); background: var(--surface); display: grid; gap: 6px; }
.project { padding: 18px; border-radius: 14px; border: 2px solid var(--sun); background: var(--sun-soft); display: grid; gap: 12px; }
.project .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.project ol, .project ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
.project .tests li::marker { content: "✓  "; color: var(--ok); font-weight: 700; }

/* ---------- lesson ---------- */
.lesson-head { display: grid; gap: 10px; }
.lesson-head .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.goal { font-size: 1.08rem; padding-left: 14px; border-left: 4px solid var(--sky); }
figure.diagram { margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 8px; }
figure.diagram figcaption { font-size: 0.85rem; color: var(--muted); }
.dg { width: 100%; overflow-x: auto; }
.dg svg { display: block; width: 100%; min-width: 520px; height: auto; font-family: var(--f-body); font-size: 15px; }
.dg .bx { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1.5; }
.dg .sk { fill: var(--surface-2); stroke: var(--sky-ink); stroke-width: 1.5; }
.dg .sn { fill: var(--sun-soft); stroke: var(--sun); stroke-width: 2; }
.dg .rd { stroke: var(--red); stroke-width: 2; }
.dg .rd-fill { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 6 5; }
.dg .border-fill { fill: var(--fg); stroke: none; }
.dg .ln path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.dg .ar { stroke: var(--muted); stroke-width: 2; fill: none; }
.dg .sun-ar { stroke: var(--sun-ink); }
.dg .red-ar { stroke: var(--red); }
.dg .ah { fill: var(--muted); }
.dg .t { fill: var(--fg); }
.dg .tb { fill: var(--fg); font-weight: 700; }
.dg .tm { fill: var(--muted); font-size: 13px; }
.dg .border-fill + text.tb { fill: var(--bg); }

/* demo player */
.player { border-radius: 14px; overflow: hidden; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); }
.player-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
.player-bar .file { font-family: var(--f-mono); font-size: 0.8rem; color: var(--code-dim); }
.player-bar .dots { display: flex; gap: 6px; }
.player-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: #2c4558; }
.player-bar .dots i:nth-child(1) { background: var(--red); } .player-bar .dots i:nth-child(2) { background: var(--sun); } .player-bar .dots i:nth-child(3) { background: var(--sky); }
.player-bar .spacer { flex: 1; }
.player-bar .lang { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sky); }
.copy { border: 1px solid rgba(255,255,255,0.18); background: transparent; color: var(--code-fg); border-radius: 6px; padding: 3px 10px; font-size: 0.75rem; }
.code, pre.static, .editor { font-variant-ligatures: none; }
.code { overflow-x: auto; padding: 12px 0; font-family: var(--f-mono); font-size: 0.86rem; line-height: 1.65; }
.code .ln { display: grid; grid-template-columns: 3.2em max-content; padding-right: 20px; transition: background 0.25s, opacity 0.25s; border-left: 3px solid transparent; }
.code .ln > span:first-child { color: var(--code-dim); text-align: right; padding-right: 1em; user-select: none; }
.code .ln > code { background: none; padding: 0; font-size: inherit; color: inherit; white-space: pre; }
.player.playing .code .ln, .player.stepping .code .ln { opacity: 0.45; }
.player .code .ln.on { opacity: 1; background: var(--code-hl); border-left-color: var(--sun); }
.narration { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 16px; background: rgba(135, 206, 235, 0.08); border-top: 1px solid rgba(255,255,255,0.08); min-height: 70px; }
.narration .stepno { font-family: var(--f-mono); font-size: 0.78rem; color: var(--sun); padding-top: 2px; white-space: nowrap; }
.narration p { color: var(--code-fg); }
.narration code { background: rgba(255,255,255,0.1); color: var(--code-fg); }
.console { font-family: var(--f-mono); font-size: 0.82rem; padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.08); color: #9ff0c3; white-space: pre-wrap; min-height: 42px; }
.console::before { content: "output ›  "; color: var(--code-dim); }
.console:empty::after { content: "—"; color: var(--code-dim); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px 14px; }
.controls button { border: 1px solid rgba(255,255,255,0.2); background: transparent; color: var(--code-fg); border-radius: 8px; padding: 6px 14px; font-weight: 700; font-size: 0.85rem; }
.controls button.play { background: var(--sun); border-color: var(--sun); color: #2a2100; }
.controls button:disabled { opacity: 0.35; cursor: default; }
.track { flex: 1; min-width: 120px; display: flex; gap: 4px; }
.track button { flex: 1; height: 6px; padding: 0; border-radius: 3px; background: #2c4558; border: 0; min-width: 8px; }
.track button.seen { background: var(--sky); }
.track button.cur { background: var(--sun); }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-tag .hljs-name { color: #87ceeb; }
.hljs-string, .hljs-attr + .hljs-string, .hljs-template-string { color: #ffd23f; }
.hljs-number, .hljs-literal { color: #ff9a9e; }
.hljs-comment { color: #6f8ca0; font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title { color: #b8ecff; }
.hljs-attr, .hljs-attribute, .hljs-property { color: #ffe68a; }
.hljs-params, .hljs-variable { color: #e6f2f9; }
.hljs-selector-class, .hljs-selector-id { color: #ffb4b6; }
.hljs-meta { color: #9fb8c8; }

/* practice + quiz */
.practice { padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 12px; }
.practice .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { padding: 10px 14px; border-radius: 8px; background: var(--sun-soft); border-left: 4px solid var(--sun); }
pre.static { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 0.85rem; line-height: 1.6; overflow-x: auto; }
pre.static .out { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); color: #9ff0c3; }
.quiz { display: grid; gap: 16px; }
.q { display: grid; gap: 8px; }
.q fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.q legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.opt:hover:not([disabled]) { border-color: var(--sky-ink); }
.opt .mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--bg)); }
.opt.right .mark { border-color: var(--ok); background: var(--ok); color: var(--bg); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .mark { border-color: var(--red); background: var(--red); color: #fff; }
.opt[disabled] { cursor: default; }
.why { font-size: 0.92rem; color: var(--muted); }
.complete-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; border-radius: 14px; border: 1px solid var(--line); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--fg); }
.pager a:hover { border-color: var(--sky-ink); }
.pager a.next { text-align: right; }

/* interview */
.problems { display: grid; gap: 8px; }
.problems a { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); text-decoration: none; color: var(--fg); }
.problems a:hover { border-color: var(--sky-ink); }
.filter { display: flex; gap: 6px; flex-wrap: wrap; }
.filter button { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 99px; padding: 5px 14px; font-size: 0.85rem; font-weight: 700; }
.filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.editor { width: 100%; min-height: 220px; resize: vertical; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 0.88rem; line-height: 1.6; tab-size: 2; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--f-mono); font-size: 0.85rem; }
.results li { padding: 8px 12px; border-radius: 8px; background: var(--surface); overflow-wrap: anywhere; }
.results li.pass { box-shadow: inset 4px 0 0 var(--ok); }
.results li.fail { box-shadow: inset 4px 0 0 var(--red); background: var(--red-soft); }
details.qa { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--bg); }
details.qa summary { font-weight: 700; cursor: pointer; }
details.qa p { margin-top: 8px; color: var(--muted); }
.qas { display: grid; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 0.9rem; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.toast.show { opacity: 1; }

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .overall .bar { width: 64px; }
  .sync { display: none; }
  .side { position: fixed; z-index: 30; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); height: auto; transform: translateX(-102%); transition: transform 0.25s ease; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 0 40px rgba(0,0,0,0.25); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(5, 15, 25, 0.45); }
  .tiers { grid-template-columns: minmax(0, 1fr); }
  .project .cols { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 20px; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { text-align: left; }
}
@media (max-width: 420px) { .overall .txt { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  <a class="brand" href="#home" aria-label="Full-Stack Bootcamp home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--sky)"/><path d="M9 21 L14 16 L9 11" fill="none" stroke="#0c2131" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="19" width="8" height="3" rx="1.5" fill="var(--red)"/><circle cx="24" cy="9" r="3" fill="var(--sun)"/></svg>
    <span class="brand-name">Full-Stack Bootcamp</span>
  </a>
  <span class="spacer"></span>
  <span class="overall" aria-live="polite"><span class="txt" id="overallTxt">0% complete</span><span class="bar"><i id="overallBar" style="width:0%"></i></span></span>
  <span class="sync" id="sync">Progress saved on this device</span>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Course map"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const COURSE = /*COURSE*/null;
const DIAGRAMS = /*DIAGRAMS*/null;
</script>
<script>
(() => {
  "use strict";
  // ---------- data helpers ----------
  const mods = COURSE.modules;
  const allLessons = [];
  // Course order: every Beginner lesson, then every Intermediate lesson, then every Advanced lesson
  mods.forEach((m) => m.beginner.lessons.forEach((l, i) => allLessons.push({ ...l, mod: m, index: i, tier: "beginner" })));
  mods.forEach((m) => (m.intermediateLessons || []).forEach((l, i) => allLessons.push({ ...l, mod: m, index: i, tier: "intermediate" })));
  mods.forEach((m) => (m.advancedLessons || []).forEach((l, i) => allLessons.push({ ...l, mod: m, index: i, tier: "advanced" })));
  const lessonsOf = (m, t) => (t === "advanced" ? m.advancedLessons || [] : t === "intermediate" ? m.intermediateLessons || [] : t === "beginner" ? m.beginner.lessons : []);
  const tierPill = (t) => (t === "advanced" ? "red" : t === "intermediate" ? "sun" : "");
  const levelPill = (lv) => (lv === "Hard" ? "red" : lv === "Medium" ? "sun" : "");
  const tierName = (id) => (COURSE.tiers.find((t) => t.id === id) || {}).name || id;
  const lessonById = Object.fromEntries(allLessons.map((l) => [l.id, l]));
  const problemById = Object.fromEntries(COURSE.interview.problems.map((p) => [p.id, p]));
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const hlLang = { js: "javascript", jsx: "javascript", ts: "typescript", html: "xml", css: "css", python: "python", sql: "sql", text: "plaintext" };
  function hl(line, lang) {
    try { if (window.hljs && lang !== "text") return hljs.highlight(line, { language: hlLang[lang] || "plaintext", ignoreIllegals: true }).value; } catch (e) {}
    return esc(line);
  }
  const langName = { js: "JavaScript", jsx: "JSX", ts: "TypeScript", html: "HTML", css: "CSS", python: "Python", sql: "SQL", text: "Notes" };
  const icon = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--red)" d="M21.6 7.2a2.7 2.7 0 0 0-1.9-1.9C18 4.8 12 4.8 12 4.8s-6 0-7.7.5A2.7 2.7 0 0 0 2.4 7.2 28 28 0 0 0 2 12a28 28 0 0 0 .4 4.8 2.7 2.7 0 0 0 1.9 1.9c1.7.5 7.7.5 7.7.5s6 0 7.7-.5a2.7 2.7 0 0 0 1.9-1.9A28 28 0 0 0 22 12a28 28 0 0 0-.4-4.8z"/><path fill="#fff" d="M10 15.5v-7l6 3.5z"/></svg>',
    doc: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
  };

  // ---------- progress (db per viewer, else this browser) ----------
  const LS_KEY = "fsb-progress-v1";
  let state = { done: {}, quiz: {}, solved: {}, last: null };
  let store = null; // { save(obj) }
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = { ...state, ...JSON.parse(raw) }; } catch (e) {}
  let saveTimer = null;
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    if (!store) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.save(state), 800);
  }
  const setSync = (t) => { const el = $("#sync"); if (el) el.textContent = t; };
  async function connectStore() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const timer = setTimeout(() => setSync("Saving on this device for now"), 10000);
      const snap = await ref.get();
      clearTimeout(timer);
      if (snap.exists) {
        const remote = snap.data();
        state = {
          done: { ...state.done, ...(remote.done || {}) },
          quiz: { ...(remote.quiz || {}), ...state.quiz },
          solved: { ...state.solved, ...(remote.solved || {}) },
          last: state.last || remote.last || null,
        };
      }
      let busy = false, again = false, readOnly = false;
      store = {
        async save(obj) {
          if (readOnly) return;
          if (busy) { again = true; return; }
          busy = true;
          try { await ref.set(JSON.parse(JSON.stringify(obj))); setSync("Progress synced to your account"); }
          catch (e) { if (e && e.code === "invalid_argument") { readOnly = true; store = null; setSync("Progress saved on this device"); } }
          busy = false;
          if (again) { again = false; store && store.save(state); }
        },
      };
      setSync("Progress synced to your account");
      render();
      if (Object.keys(state.done).length) store.save(state);
    } catch (e) { /* stay on local storage */ }
  }

  // ---------- counts ----------
  const modDone = (m, t = "beginner") => lessonsOf(m, t).filter((l) => state.done[l.id]).length;
  function updateOverall() {
    const pct = Math.round((Object.keys(state.done).filter((k) => lessonById[k]).length / allLessons.length) * 100);
    $("#overallTxt").textContent = pct + "% complete";
    $("#overallBar").style.width = pct + "%";
  }

  // ---------- routing ----------
  let tier = "beginner";
  function parse() {
    const h = decodeURIComponent(location.hash.slice(1)) || "home";
    if (h.startsWith("m-")) return { view: "module", id: h.slice(2) };
    if (h.startsWith("l-")) return { view: "lesson", id: h.slice(2) };
    if (h.startsWith("p-")) return { view: "problem", id: h.slice(2) };
    if (h.startsWith("t-")) return { view: "tier", id: h.slice(2) };
    if (h === "interview" || h === "projects") return { view: h };
    return { view: "home" };
  }

  // ---------- sidebar ----------
  function renderSide(route) {
    const cur = location.hash.slice(1) || "home";
    const tierBtns = COURSE.tiers.map((t) => `<button type="button" data-tier="${t.id}" aria-pressed="${t.id === tier}">${t.name}</button>`).join("");
    const modLinks = mods.map((m) => {
      const total = lessonsOf(m, tier).length, done = modDone(m, tier);
      const href = tier === "beginner" ? "#m-" + m.id : "#t-" + tier + "-" + m.id;
      const curLesson = route.view === "lesson" && lessonById[route.id];
      const isCur = cur === href.slice(1) || (curLesson && curLesson.mod.id === m.id && curLesson.tier === tier);
      const count = total ? `<span class="count ${done === total ? "full" : ""}">${done}/${total}</span>` : `<span class="count">${(m[tier] || []).length} topics</span>`;
      return `<a class="navlink" href="${href}" ${isCur ? 'aria-current="page"' : ""}><span>${esc(m.name)}</span>${count}</a>`;
    }).join("");
    $("#side").innerHTML = `
      <div class="tier-tabs" role="group" aria-label="Tier">${tierBtns}</div>
      <div class="navgroup"><a class="navlink" href="#home" ${cur === "home" ? 'aria-current="page"' : ""}><span>Start here</span></a>
        <a class="navlink" href="#projects" ${cur === "projects" ? 'aria-current="page"' : ""}><span>All practice projects</span></a>
        <a class="navlink" href="#interview" ${cur === "interview" || route.view === "problem" ? 'aria-current="page"' : ""}><span>Interview coding tests</span><span class="count">${Object.keys(state.solved).length}/${COURSE.interview.problems.length}</span></a></div>
      <div class="navgroup"><span class="label">${esc(COURSE.tiers.find((t) => t.id === tier).name)} modules</span>${modLinks}</div>`;
    $("#side").querySelectorAll("[data-tier]").forEach((b) => b.addEventListener("click", () => {
      tier = b.dataset.tier;
      const want = tier === "beginner" ? "home" : "t-" + tier;
      if (location.hash.slice(1) === want) render(false); else location.hash = want;
    }));
  }

  // ---------- views ----------
  function viewHome() {
    const next = allLessons.find((l) => !state.done[l.id]);
    const last = state.last && lessonById[state.last];
    const target = last && !state.done[last.id] ? last : next;
    const started = Object.keys(state.done).length > 0;
    const tierCards = COURSE.tiers.map((t) => `
      <a class="tier-card t-${t.id}" href="${t.id === "beginner" ? "#m-html" : "#t-" + t.id}">
        <span class="stripe"></span><h3>${t.name}</h3><p class="muted">${esc(t.blurb)}</p>
        <span>${(() => { const n = allLessons.filter((l) => l.tier === t.id).length; return n ? `<span class="pill sun">${n} lessons ready</span>` : `<span class="pill">Outline · lessons coming</span>`; })()}</span>
      </a>`).join("");
    const path = mods.map((m, i) => {
      const done = modDone(m), total = m.beginner.lessons.length;
      return `<a class="mod-card" href="#m-${m.id}">
        <div class="top"><span class="step">${String(i + 1).padStart(2, "0")} · ${esc(m.kind)}</span>${done === total ? '<span class="pill ok">Done</span>' : ""}</div>
        <h3>${esc(m.name)}</h3><p>${esc(m.blurb)}</p>
        <div class="bar" aria-label="${done} of ${total} lessons done"><i style="width:${(done / total) * 100}%"></i></div>
      </a>`;
    }).join("");
    return `
      <section class="hero">
        <span class="label">Self-paced · ${mods.length} modules · 3 tiers</span>
        <h1>Learn to build the whole web app: page, server and database.</h1>
        <p class="lede">Every lesson has an animated code walkthrough, a diagram where it helps, a practice task with a solution, a quick check, and links to free video explanations. Each module ends with a project, and every project has a test checklist.</p>
        <div class="hero-actions">
          ${target ? `<a class="btn primary" href="#l-${target.id}">${started ? "Continue" : "Start"}: ${esc(target.title)}</a>` : `<span class="pill ok">Every lesson complete</span>`}
          <a class="btn" href="#interview">Practice interview tests</a>
        </div>
      </section>
      <section class="section"><div class="section-head"><h2>Three tiers</h2></div><div class="tiers">${tierCards}</div></section>
      <section class="section"><div class="section-head"><h2>Beginner learning path</h2><span class="muted">Take them in order, or jump to what you need</span></div><div class="path">${path}</div></section>`;
  }

  function projectCard(p, heading = "Module project") {
    return `<section class="project"><span class="label">${heading}</span><h2>${esc(p.title)}</h2><p>${md(p.brief)}</p>
      <div class="cols"><div><h3>Steps</h3><ol>${p.steps.map((s) => `<li>${md(s)}</li>`).join("")}</ol></div>
      <div><h3>Test it</h3><ul class="tests">${p.test.map((s) => `<li>${md(s)}</li>`).join("")}</ul></div></div></section>`;
  }
  function docsRow(m, extraQuery) {
    const q = encodeURIComponent((extraQuery ? m.video.replace(/ for beginners.*$/, "") + " " + extraQuery : m.video));
    return `<div class="linkrow">
      <a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">${icon.play} Find video explanations</a>
      ${m.docs.map((d) => `<a href="${d.url}" target="_blank" rel="noopener">${icon.doc} ${esc(d.label)}</a>`).join("")}</div>`;
  }

  function lessonListHtml(list) {
    return list.map((l, i) => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#l-${l.id}">
      <span class="num">${state.done[l.id] ? "✓" : i + 1}</span><span><strong>${esc(l.title)}</strong><br><span class="meta">${md(l.goal)}</span></span><span class="meta">${l.minutes} min</span></a></li>`).join("");
  }

  function viewModule(id) {
    const m = mods.find((x) => x.id === id);
    if (!m) return viewHome();
    const ls = lessonListHtml(m.beginner.lessons);
    const ils = lessonListHtml(m.intermediateLessons || []);
    const als = lessonListHtml(m.advancedLessons || []);
    const extra = m.id === "interview" ? `<div class="callout"><h3>Coding tests</h3><p>${COURSE.interview.problems.length} classic problems with a live code editor that runs the tests in your browser, plus ${COURSE.interview.questions.length} concept questions.</p><p><a class="btn sun" href="#interview">Open the coding tests</a></p></div>` : "";
    return `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span><span>Beginner</span></nav>
      <header class="lesson-head"><div class="meta"><span class="pill">${esc(m.kind)}</span>${m.libs ? m.libs.map((x) => `<span class="pill sun">${esc(x)}</span>`).join("") : ""}</div>
        <h1>${esc(m.name)}</h1><p class="goal">${esc(m.blurb)}</p></header>
      <section class="section"><div class="section-head"><h2>Beginner lessons</h2><span class="muted">${modDone(m)} of ${m.beginner.lessons.length} done</span></div><ol class="lesson-list">${ls}</ol></section>
      ${extra}
      ${projectCard(m.beginner.project)}
      ${ils ? `<section class="section"><div class="section-head"><h2>Intermediate lessons</h2><span class="muted">${modDone(m, "intermediate")} of ${(m.intermediateLessons || []).length} done</span></div><ol class="lesson-list">${ils}</ol></section>` : ""}
      ${als ? `<section class="section"><div class="section-head"><h2>Advanced lessons</h2><span class="muted">${modDone(m, "advanced")} of ${(m.advancedLessons || []).length} done</span></div><ol class="lesson-list">${als}</ol></section>` : ""}
      <section class="section"><div class="section-head"><h2>Docs and videos</h2></div>${docsRow(m)}</section>`;
  }

  function viewTier(arg) {
    const cut = arg.indexOf("-");
    const tid = cut === -1 ? arg : arg.slice(0, cut), mid = cut === -1 ? "" : arg.slice(cut + 1);
    const t = COURSE.tiers.find((x) => x.id === tid);
    if (!t || tid === "beginner") return viewHome();
    tier = tid;
    const written = allLessons.some((l) => l.tier === tid);
    const list = (mid ? mods.filter((m) => m.id === mid) : mods).map((m) => {
      const ls = lessonsOf(m, tid);
      return `<section class="section" id="sec-${m.id}"><div class="section-head"><h2>${mid ? "Lessons" : `<a href="#t-${tid}-${m.id}">${esc(m.name)}</a>`}</h2>${ls.length ? `<span class="muted">${modDone(m, tid)} of ${ls.length} done</span>` : `<a href="#m-${m.id}">Beginner lessons →</a>`}</div>
      ${ls.length ? `<ol class="lesson-list">${lessonListHtml(ls)}</ol>${mid ? docsRow(m) : ""}` : `<ul class="outline">${m[tid].map((x) => `<li><span>${esc(x)}</span></li>`).join("")}</ul>`}</section>`;
    }).join("");
    const projects = COURSE.tierProjects[tid].map((p) => p.steps ? projectCard(p, t.name + " capstone") : `<div class="callout"><h3>${esc(p.title)}</h3><p>${esc(p.brief)}</p><div class="linkrow">${p.uses.map((u) => `<span class="pill">${esc(u)}</span>`).join("")}</div></div>`).join("");
    return `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span>${mid ? `<a href="#t-${tid}">${t.name}</a><span>/</span><span>${esc(mods.find((m) => m.id === mid).name)}</span>` : `<span>${t.name}</span>`}</nav>
      <header class="lesson-head"><div class="meta"><span class="pill ${tid === "advanced" ? "red" : "sun"}">${t.name} tier</span>${written ? "" : '<span class="pill">Outline</span>'}</div>
        <h1>${mid ? esc(mods.find((m) => m.id === mid).name) + " · " + t.name : t.name}</h1><p class="goal">${esc(t.blurb)}</p></header>
      ${written ? "" : `<div class="callout"><strong>These lessons are planned, not written yet.</strong><p class="muted">Each topic below becomes a full lesson (walkthrough, practice, quiz) in a later pass.</p></div>`}
      ${mid ? "" : `<section class="section"><div class="section-head"><h2>${t.name} capstone projects</h2></div>${projects}</section>`}
      ${list}`;
  }

  function viewLesson(id) {
    const l = lessonById[id];
    if (!l) return viewHome();
    state.last = id; save();
    const m = l.mod, i = allLessons.indexOf(l);
    const prev = allLessons[i - 1], next = allLessons[i + 1];
    const d = l.diagram && DIAGRAMS[l.diagram];
    const quiz = l.check.map((q, qi) => {
      const chosen = state.quiz[l.id] && state.quiz[l.id][qi];
      const answered = chosen !== undefined;
      return `<div class="q" data-q="${qi}"><fieldset><legend>${qi + 1}. ${md(q.q)}</legend>
        ${q.options.map((o, oi) => {
          const cls = answered ? (oi === q.answer ? "right" : oi === chosen ? "wrong" : "") : "";
          return `<button type="button" class="opt ${cls}" data-o="${oi}" ${answered ? "disabled" : ""}><span class="mark">${answered && oi === q.answer ? "✓" : answered && oi === chosen ? "✕" : String.fromCharCode(65 + oi)}</span><span>${md(o)}</span></button>`;
        }).join("")}</fieldset>
        <p class="why" ${answered ? "" : "hidden"}>${chosen === q.answer ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> "}${md(q.why)}</p></div>`;
    }).join("");
    const sol = l.practice.solution;
    return `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span><a href="${l.tier === "beginner" ? "#m-" + m.id : "#t-" + l.tier + "-" + m.id}">${esc(m.name)}</a><span>/</span><span>${tierName(l.tier)} lesson ${l.index + 1}</span></nav>
      <header class="lesson-head"><div class="meta"><span class="pill ${tierPill(l.tier)}">${tierName(l.tier)}</span><span class="pill sun">${l.minutes} min</span>${state.done[l.id] ? '<span class="pill ok">Completed</span>' : ""}</div>
        <h1>${esc(l.title)}</h1><p class="goal"><strong>Goal:</strong> ${md(l.goal)}</p></header>
      <section class="prose">${l.body.map((p) => `<p>${md(p)}</p>`).join("")}</section>
      ${d ? `<figure class="diagram"><div class="dg">${d.svg}</div><figcaption>${esc(d.title)}</figcaption></figure>` : ""}
      <section class="section"><div class="section-head"><h2>Walkthrough</h2><span class="muted">Press Play, or step through it line by line</span></div>
        <div id="player"></div>
        ${docsRow(m, l.title)}</section>
      <section class="practice"><span class="label">Practice</span><p>${md(l.practice.task)}</p>
        <div class="actions"><button type="button" class="btn" id="hintBtn">Show hint</button><button type="button" class="btn" id="solBtn">Show solution</button></div>
        <p class="hint" id="hint" hidden>${md(l.practice.hint)}</p>
        <div id="sol" hidden><pre class="static"><code>${sol.code.split("\n").map((x) => hl(x, sol.lang)).join("\n")}</code>${sol.output ? `<span class="out">${esc(sol.output)}</span>` : ""}</pre></div></section>
      <section class="section"><div class="section-head"><h2>Check yourself</h2></div><div class="quiz">${quiz}</div></section>
      <div class="complete-row"><div><strong>${state.done[l.id] ? "Lesson complete." : "Finished the lesson?"}</strong><p class="muted">${state.done[l.id] ? "It counts toward your progress." : "Mark it done to track your progress."}</p></div>
        <button type="button" class="btn ${state.done[l.id] ? "" : "primary"}" id="doneBtn">${state.done[l.id] ? "Mark as not done" : "Mark complete"}</button></div>
      <nav class="pager" aria-label="Lessons">${prev ? `<a href="#l-${prev.id}"><span class="label">Previous</span><span>${esc(prev.title)}</span></a>` : "<span></span>"}
        ${next ? `<a class="next" href="#l-${next.id}"><span class="label">Next${next.tier !== l.tier ? " · " + tierName(next.tier) + " tier" : next.mod !== m ? " · " + esc(next.mod.name) : ""}</span><span>${esc(next.title)}</span></a>` : ""}</nav>`;
  }

  function wireLesson(id) {
    const l = lessonById[id];
    mountPlayer($("#player"), l.example, l.demo);
    $("#hintBtn").onclick = (e) => { const h = $("#hint"); h.hidden = !h.hidden; e.currentTarget.textContent = h.hidden ? "Show hint" : "Hide hint"; };
    $("#solBtn").onclick = (e) => { const s = $("#sol"); s.hidden = !s.hidden; e.currentTarget.textContent = s.hidden ? "Show solution" : "Hide solution"; };
    $("#doneBtn").onclick = () => {
      if (state.done[id]) delete state.done[id]; else state.done[id] = true;
      save(); toast(state.done[id] ? "Marked complete" : "Marked not done");
      // update in place so the walkthrough keeps its position
      const done = !!state.done[id], row = $(".complete-row");
      row.querySelector("strong").textContent = done ? "Lesson complete." : "Finished the lesson?";
      row.querySelector("p").textContent = done ? "It counts toward your progress." : "Mark it done to track your progress.";
      const b = $("#doneBtn"); b.textContent = done ? "Mark as not done" : "Mark complete"; b.classList.toggle("primary", !done);
      const meta = $(".lesson-head .meta"), pill = meta.querySelector(".pill.ok");
      if (done && !pill) meta.insertAdjacentHTML("beforeend", '<span class="pill ok">Completed</span>'); else if (!done && pill) pill.remove();
      renderSide(parse()); updateOverall();
    };
    document.querySelectorAll(".q").forEach((qEl) => {
      const qi = Number(qEl.dataset.q), q = l.check[qi];
      qEl.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
        const chosen = Number(b.dataset.o);
        state.quiz[id] = { ...(state.quiz[id] || {}), [qi]: chosen };
        save();
        qEl.querySelectorAll(".opt").forEach((o) => {
          const oi = Number(o.dataset.o);
          o.disabled = true;
          o.classList.toggle("right", oi === q.answer);
          o.classList.toggle("wrong", oi === chosen && chosen !== q.answer);
          o.querySelector(".mark").textContent = oi === q.answer ? "✓" : oi === chosen ? "✕" : String.fromCharCode(65 + oi);
        });
        const why = qEl.querySelector(".why");
        why.innerHTML = (chosen === q.answer ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> ") + md(q.why);
        why.hidden = false; why.setAttribute("tabindex", "-1"); why.focus({ preventScroll: true });
      }));
    });
  }

  // ---------- animated walkthrough ----------
  function mountPlayer(el, ex, steps) {
    const lines = ex.code.split("\n");
    el.innerHTML = `<div class="player" aria-label="Code walkthrough">
      <div class="player-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="file">${esc(ex.file || "example." + (ex.lang === "python" ? "py" : ex.lang))}</span><span class="spacer"></span><span class="lang">${langName[ex.lang] || ex.lang}</span><button type="button" class="copy">Copy</button></div>
      <div class="code" role="region" aria-label="Code" tabindex="0">${lines.map((t, i) => `<div class="ln" data-n="${i + 1}"><span>${i + 1}</span><code>${hl(t, ex.lang) || " "}</code></div>`).join("")}</div>
      <div class="narration" aria-live="polite"><span class="stepno">ready</span><p>${steps.length} steps. Press Play to watch, or use Next to go at your own pace.</p></div>
      <div class="console" aria-label="Output"></div>
      <div class="controls"><button type="button" class="prev" aria-label="Previous step">◀ Back</button><button type="button" class="play">▶ Play</button><button type="button" class="next" aria-label="Next step">Next ▶</button>
        <div class="track" role="group" aria-label="Jump to step">${steps.map((_, i) => `<button type="button" aria-label="Step ${i + 1}"></button>`).join("")}</div></div></div>`;
    const P = $(".player", el), nar = $(".narration p", el), no = $(".stepno", el), out = $(".console", el), playBtn = $(".play", el);
    const lnEls = [...el.querySelectorAll(".ln")], dots = [...el.querySelectorAll(".track button")];
    let cur = -1, timer = null;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function show(i) {
      cur = Math.max(0, Math.min(steps.length - 1, i));
      const s = steps[cur];
      P.classList.add("stepping");
      lnEls.forEach((x) => x.classList.toggle("on", s.lines.includes(Number(x.dataset.n))));
      const first = lnEls[s.lines[0] - 1];
      if (first) { const box = $(".code", el); const top = first.offsetTop - box.clientHeight / 3; box.scrollTo({ top: Math.max(0, top), behavior: reduce ? "auto" : "smooth" }); }
      no.textContent = `step ${cur + 1}/${steps.length}`;
      nar.innerHTML = md(s.say || "");
      let o = "";
      for (let k = 0; k <= cur; k++) if (steps[k].out) o += (o ? "\n" : "") + steps[k].out;
      out.textContent = o;
      dots.forEach((d, k) => { d.classList.toggle("seen", k < cur); d.classList.toggle("cur", k === cur); });
      $(".prev", el).disabled = cur === 0;
      $(".next", el).disabled = cur === steps.length - 1;
    }
    function stop() { clearInterval(timer); timer = null; P.classList.remove("playing"); playBtn.textContent = "▶ Play"; }
    function play() {
      if (cur >= steps.length - 1) cur = -1;
      P.classList.add("playing"); playBtn.textContent = "❚❚ Pause";
      show(cur + 1);
      timer = setInterval(() => { if (cur >= steps.length - 1) { stop(); return; } show(cur + 1); }, 3800);
    }
    playBtn.onclick = () => (timer ? stop() : play());
    $(".next", el).onclick = () => { stop(); show(cur + 1); };
    $(".prev", el).onclick = () => { stop(); show(cur - 1); };
    dots.forEach((d, k) => (d.onclick = () => { stop(); show(k); }));
    $(".copy", el).onclick = async (e) => {
      try { await navigator.clipboard.writeText(ex.code); e.target.textContent = "Copied"; }
      catch (err) { const r = document.createRange(); r.selectNodeContents($(".code", el)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = "Selected"; }
      setTimeout(() => (e.target.textContent = "Copy"), 1500);
    };
    $(".prev", el).disabled = true;
    activePlayerStop = stop;
  }
  let activePlayerStop = null;

  // ---------- interview ----------
  let levelFilter = "All";
  function viewInterview() {
    const P = COURSE.interview.problems;
    const levels = ["All", ...new Set(P.map((p) => p.level))];
    const list = P.filter((p) => levelFilter === "All" || p.level === levelFilter).map((p) => `<a href="#p-${p.id}"><span><strong>${esc(p.title)}</strong><br><span class="muted">${esc(p.topic)}</span></span><span class="pill ${levelPill(p.level)}">${p.level}</span>${state.solved[p.id] ? '<span class="pill ok">Solved</span>' : `<span class="pill">${tierName(p.tier)}</span>`}</a>`).join("");
    return `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span><span>Interview coding tests</span></nav>
      <header class="lesson-head"><div class="meta"><span class="pill">Interview Prep</span><span class="pill sun">${Object.keys(state.solved).length}/${P.length} solved</span></div>
        <h1>Interview coding tests</h1><p class="goal">Write your solution in the editor and run the tests right here in your browser. Use the 6-step method from <a href="#l-int-how">How junior coding interviews work</a>, and say each step out loud.</p></header>
      <section class="section"><div class="section-head"><h2>Problems</h2><div class="filter" role="group" aria-label="Filter by level">${levels.map((lv) => `<button type="button" data-lv="${lv}" aria-pressed="${lv === levelFilter}">${lv}</button>`).join("")}</div></div><div class="problems">${list}</div></section>
      <section class="section"><div class="section-head"><h2>Concept questions</h2><span class="muted">Answer out loud, then open to check</span></div>
        <div class="qas">${COURSE.interview.questions.map((q) => `<details class="qa"><summary>${md(q.q)}</summary><p>${md(q.a)}</p></details>`).join("")}</div></section>
      ${projectCard(mods.find((m) => m.id === "interview").beginner.project, "Practice")}`;
  }
  function stubFor(p) {
    const sig = p.solution.split("\n")[0];
    return sig + "\n  // your code here\n}\n";
  }
  function viewProblem(id) {
    const p = problemById[id];
    if (!p) return viewInterview();
    let draft = "";
    try { draft = localStorage.getItem("fsb-draft-" + id) || ""; } catch (e) {}
    return `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span><a href="#interview">Interview coding tests</a><span>/</span><span>${esc(p.title)}</span></nav>
      <header class="lesson-head"><div class="meta"><span class="pill ${levelPill(p.level)}">${p.level}</span><span class="pill">${esc(p.topic)}</span>${state.solved[id] ? '<span class="pill ok">Solved</span>' : ""}</div>
        <h1>${esc(p.title)}</h1><p class="goal">${md(p.prompt)}</p></header>
      <section class="section"><div class="section-head"><h2>Your solution</h2><span class="muted">JavaScript · runs in your browser</span></div>
        <label class="sr" for="editor">Code editor</label>
        <textarea class="editor" id="editor" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(draft || stubFor(p))}</textarea>
        <div class="linkrow"><button type="button" class="btn primary" id="runBtn">Run tests</button><button type="button" class="btn" id="resetBtn">Reset</button></div>
        <ul class="results" id="results" aria-live="polite"><li>${p.tests.length} tests will run against <code>${esc(p.fn)}</code>.</li></ul></section>
      <section class="practice"><span class="label">Stuck?</span>
        <div class="actions"><button type="button" class="btn" id="hintBtn">Show approach</button><button type="button" class="btn" id="solBtn">Show solution</button></div>
        <p class="hint" id="hint" hidden>${md(p.approach)}</p>
        <div id="sol" hidden><pre class="static"><code>${p.solution.split("\n").map((x) => hl(x, "js")).join("\n")}</code></pre><p class="muted" style="margin-top:10px"><strong>Follow-up the interviewer may ask:</strong> ${md(p.followUp)}</p></div></section>
      <nav class="pager" aria-label="Problems">${(() => { const P = COURSE.interview.problems, i = P.indexOf(p); return (P[i - 1] ? `<a href="#p-${P[i - 1].id}"><span class="label">Previous</span><span>${esc(P[i - 1].title)}</span></a>` : "<span></span>") + (P[i + 1] ? `<a class="next" href="#p-${P[i + 1].id}"><span class="label">Next</span><span>${esc(P[i + 1].title)}</span></a>` : ""); })()}</nav>`;
  }
  const workerSrc = `self.onmessage = (e) => {
    const { code, fn, tests } = e.data;
    const results = [];
    let f;
    try { f = new Function(code + "\\n;return typeof " + fn + " === 'function' ? " + fn + " : undefined;")(); }
    catch (err) { self.postMessage({ error: "Your code has a syntax error: " + err.message }); return; }
    if (typeof f !== "function") { self.postMessage({ error: "Couldn't find a function named " + fn + "." }); return; }
    for (const [args, want] of tests) {
      try { const got = f(...structuredClone(args)); results.push({ args, want, got: got === undefined ? "undefined" : got, pass: JSON.stringify(got) === JSON.stringify(want) }); }
      catch (err) { results.push({ args, want, got: "threw " + err.message, pass: false }); }
    }
    self.postMessage({ results });
  };`;
  const workerUrl = URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" }));
  function wireProblem(id) {
    const p = problemById[id];
    const ed = $("#editor"), res = $("#results");
    ed.addEventListener("keydown", (e) => {
      if (e.key === "Tab" && !e.shiftKey && !e.altKey) { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("  ", s, ed.selectionEnd, "end"); }
    });
    let t; ed.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem("fsb-draft-" + id, ed.value); } catch (e) {} }, 400); });
    $("#resetBtn").onclick = () => { ed.value = stubFor(p); try { localStorage.removeItem("fsb-draft-" + id); } catch (e) {} res.innerHTML = ""; };
    $("#runBtn").onclick = () => {
      res.innerHTML = "<li>Running…</li>";
      const w = new Worker(workerUrl);
      const kill = setTimeout(() => { w.terminate(); res.innerHTML = '<li class="fail">Stopped after 2 seconds. Check for an infinite loop.</li>'; }, 2000);
      w.onmessage = (e) => {
        clearTimeout(kill); w.terminate();
        if (e.data.error) { res.innerHTML = `<li class="fail">${esc(e.data.error)}</li>`; return; }
        const r = e.data.results, passed = r.filter((x) => x.pass).length;
        res.innerHTML = r.map((x) => `<li class="${x.pass ? "pass" : "fail"}">${x.pass ? "✓" : "✕"} ${esc(p.fn)}(${esc(x.args.map((a) => JSON.stringify(a)).join(", "))}) → ${esc(JSON.stringify(x.got))}${x.pass ? "" : `  expected ${esc(JSON.stringify(x.want))}`}</li>`).join("") +
          `<li class="${passed === r.length ? "pass" : "fail"}"><strong>${passed}/${r.length} passed</strong>${passed === r.length ? " · nice work" : ""}</li>`;
        if (passed === r.length && !state.solved[id]) { state.solved[id] = true; save(); toast("Solved: " + p.title); renderSide(parse()); }
      };
      w.onerror = (e) => { clearTimeout(kill); w.terminate(); res.innerHTML = `<li class="fail">${esc(e.message || "Error running code")}</li>`; e.preventDefault(); };
      w.postMessage({ code: ed.value, fn: p.fn, tests: p.tests });
    };
    $("#hintBtn").onclick = (e) => { const h = $("#hint"); h.hidden = !h.hidden; e.currentTarget.textContent = h.hidden ? "Show approach" : "Hide approach"; };
    $("#solBtn").onclick = (e) => { const s = $("#sol"); s.hidden = !s.hidden; e.currentTarget.textContent = s.hidden ? "Show solution" : "Hide solution"; };
  }

  function viewProjects() {
    const b = mods.map((m) => projectCard(m.beginner.project, esc(m.name) + " · Beginner project")).join("");
    const up = ["intermediate", "advanced"].map((tid) => `<section class="section"><div class="section-head"><h2>${tid[0].toUpperCase() + tid.slice(1)} capstones</h2></div>${COURSE.tierProjects[tid].map((p) => p.steps ? projectCard(p, tid[0].toUpperCase() + tid.slice(1) + " capstone") : `<div class="callout"><h3>${esc(p.title)}</h3><p>${esc(p.brief)}</p><div class="linkrow">${p.uses.map((u) => `<span class="pill">${esc(u)}</span>`).join("")}</div></div>`).join("")}</section>`).join("");
    return `<nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Course</a><span>/</span><span>Projects</span></nav>
      <header class="lesson-head"><h1>Practice projects</h1><p class="goal">One project per module. Each one has steps and a test checklist, so you know when it's really done.</p></header>${b}${up}`;
  }

  // ---------- render ----------
  function render(keepScroll, focusQ) {
    if (activePlayerStop) { activePlayerStop(); activePlayerStop = null; }
    const route = parse();
    if (route.view === "module") tier = "beginner";
    if (route.view === "lesson" && lessonById[route.id]) tier = lessonById[route.id].tier;
    let html;
    if (route.view === "module") html = viewModule(route.id);
    else if (route.view === "lesson") html = viewLesson(route.id);
    else if (route.view === "tier") html = viewTier(route.id);
    else if (route.view === "interview") html = viewInterview();
    else if (route.view === "problem") html = viewProblem(route.id);
    else if (route.view === "projects") html = viewProjects();
    else html = viewHome();
    const y = window.scrollY;
    $("#main").innerHTML = `<div class="page">${html}</div>`;
    renderSide(route); updateOverall();
    if (route.view === "lesson" && lessonById[route.id]) wireLesson(route.id);
    if (route.view === "problem" && problemById[route.id]) wireProblem(route.id);
    if (route.view === "interview") document.querySelectorAll("[data-lv]").forEach((b) => (b.onclick = () => { levelFilter = b.dataset.lv; render(true); }));
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
    if (focusQ != null) { const b = document.querySelector(`.q[data-q="${focusQ}"] .why`); if (b) b.setAttribute("tabindex", "-1"), b.focus({ preventScroll: true }); }
  }
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }

  // ---------- phone menu ----------
  const side = $("#side"), menuBtn = $("#menuBtn");
  let scrim = null;
  function closeMenu() { side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); if (scrim) { scrim.remove(); scrim = null; } }
  menuBtn.onclick = () => {
    const open = !side.classList.contains("open");
    if (!open) return closeMenu();
    side.classList.add("open"); menuBtn.setAttribute("aria-expanded", "true");
    scrim = document.createElement("div"); scrim.className = "scrim"; scrim.onclick = closeMenu; document.body.appendChild(scrim);
    const f = side.querySelector("a,button"); if (f) f.focus();
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && side.classList.contains("open")) { closeMenu(); menuBtn.focus(); } });
  side.addEventListener("click", (e) => { if (e.target.closest("a")) closeMenu(); });

  window.addEventListener("hashchange", () => render(false));
  render(false);
  connectStore();
})();
</script>
